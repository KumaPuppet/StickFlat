# Configuration Render : un seul service web gratuit qui fait tourner le serveur
# ET distribue le jeu (dossier server/public).
services:
  - type: web
    name: stickflat
    runtime: node
    plan: free
    region: frankfurt   # serveur en Europe : ~20 ms au lieu de ~160 ms (Oregon par défaut)
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MIN_PLAYERS
        value: "2"
